services:
  # ==========================================
  # PostgreSQL 16 Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: agentic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vishal2501kvs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-autonomous-agentic-support-service}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vishal2501kvs} -d ${POSTGRES_DB:-autonomous-agentic-support-service}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 7 Cache & Queue Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: agentic_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Express API Server
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vishal2501kvs}:${POSTGRES_PASSWORD:-postgres_password_123}@postgres:5432/${POSTGRES_DB:-autonomous-agentic-support-service}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-vishal2501kvs}:${POSTGRES_PASSWORD:-postgres_password_123}@postgres:5432/${POSTGRES_DB:-autonomous-agentic-support-service}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_jwt_access_secret_key_32_chars_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_key_32_chars_min}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      LLM_TEMPERATURE: 0
      AGENT_MAX_STEPS: 8
      HIGH_VALUE_THRESHOLD: 20000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 60
      DB_POOL_MAX: 10
      WORKER_CONCURRENCY: 3
      CORS_ORIGINS: '*'
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # BullMQ Agent Worker
  # ==========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_worker
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vishal2501kvs}:${POSTGRES_PASSWORD:-postgres_password_123}@postgres:5432/${POSTGRES_DB:-autonomous-agentic-support-service}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-vishal2501kvs}:${POSTGRES_PASSWORD:-postgres_password_123}@postgres:5432/${POSTGRES_DB:-autonomous-agentic-support-service}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_jwt_access_secret_key_32_chars_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_key_32_chars_min}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      LLM_TEMPERATURE: 0
      AGENT_MAX_STEPS: 8
      HIGH_VALUE_THRESHOLD: 20000
      WORKER_CONCURRENCY: 3
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
