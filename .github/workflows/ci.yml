name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - '**'
  push:
    branches-ignore:
      - 'main'

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vishal2501kvs
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: autonomous-agentic-support-service
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://vishal2501kvs:test_password_123@localhost:5432/autonomous-agentic-support-service?schema=public
      DIRECT_URL: postgresql://vishal2501kvs:test_password_123@localhost:5432/autonomous-agentic-support-service?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_key_32_chars_long
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_32_chars_long
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.0-flash
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Prisma Database Migrations
        run: npx prisma migrate deploy

      - name: Seed Database
        run: npm run seed

      - name: Run Test Suite with Coverage
        run: npm run test:coverage

      - name: Build Production Bundle
        run: npm run build

      - name: Build Docker Image
        run: docker build -t autonomous-agentic-support-service:${{ github.sha }} .

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: autonomous-agentic-support-service:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  validate-terraform:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate
